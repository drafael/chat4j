name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out sources
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install Linux WebView runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0
          sudo apt-get install -y libwebkit2gtk-4.1-0 || sudo apt-get install -y libwebkit2gtk-4.0-37

      - name: Check HTTP and JSON boundaries
        shell: bash
        run: scripts/check-http-json-boundaries.sh

      - name: Check Linux release package contract
        if: runner.os == 'Linux'
        shell: bash
        run: scripts/test-linux-release-packages.sh

      - name: Run tests
        shell: bash
        run: mvn -B -ntp test

      - name: Verify macOS doctor script
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bash -n scripts/chat4j-doctor.sh
          bash -n src/main/resources/tools/chat4j-doctor.sh
          cmp -s scripts/chat4j-doctor.sh src/main/resources/tools/chat4j-doctor.sh
          bash scripts/test-chat4j-doctor.sh

      - name: Build shaded jar
        run: mvn -B -ntp -DskipTests package
